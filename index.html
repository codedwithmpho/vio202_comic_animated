<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VIO Interactive Comic</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>
<style>
.mpho-bar{position:fixed;top:12px;right:12px;z-index:99999;display:flex;gap:8px;font-family:"DM Sans",system-ui,sans-serif}
.mpho-bar a{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;border:2px solid #1d2a1a;background:#fff8ea;color:#1d2a1a;font-size:14px;font-weight:700;text-decoration:none;box-shadow:3px 3px 0 #1d2a1a;transition:transform .15s}
.mpho-bar a:hover{transform:translate(-1px,-1px)}
.mpho-bar a.close{background:#e8573c;color:#fff8ea}
</style>
<nav class="mpho-bar" aria-label="Portfolio links">
  <a id="mpho-x" href="../infographic/index.html">character infographic →</a>
  <a class="close" id="mpho-home" href="../portfolio.html" aria-label="Close and go back to the portfolio">✕ back to portfolio</a>
</nav>
<script>
/* On GitHub Pages these sites live in separate repos, so the links need full addresses. */
if (location.hostname === "codedwithmpho.github.io") {
  document.getElementById("mpho-x").href = "https://codedwithmpho.github.io/vio202_comic_infographic/";
  document.getElementById("mpho-home").href = "https://codedwithmpho.github.io/personal_portfolio/";
}
</script>


    <!-- Intro banner: click anywhere on it to dismiss -->
    <div id="introBanner">
        🔊 Some images are animated — click on them to hear a sound!
        <span>(tap to dismiss)</span>
    </div>
    <!--
        Each panel below is just the page image.
        Gifs + sounds are added automatically by
        script.js — go edit the SOUND_GIFS list at
        the top of that file to add more.
    -->

    <section class="comic-panel" id="part1">
        <img src="images/part1.jpg" class="page" alt="Clementine Citrus comic part 1">
    </section>

    <section class="comic-panel" id="part2">
        <img src="images/part2.jpg" class="page" alt="Clementine Citrus comic part 2">
    </section>

    <section class="comic-panel" id="part3">
        <img src="images/part3.jpg" class="page" alt="Clementine Citrus comic part 3">
    </section>

    <section class="comic-panel" id="part4">
        <img src="images/part4.jpg" class="page" alt="Clementine Citrus comic part 4">
    </section>

    <section class="comic-panel" id="part5">
        <img src="images/part5.jpg" class="page" alt="Clementine Citrus comic part 5">
    </section>

    <section class="comic-panel" id="part6">

    <section class="comic-panel" id="part7">
        <img src="images/part7.jpg" class="page" alt="Clementine Citrus comic part 7">
    </section>

    <script src="script.js"></script>

</body>
