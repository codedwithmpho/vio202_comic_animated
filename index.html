<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>VIO Interactive Comic</title>

    <link rel="stylesheet" href="styles.css">

</head>


<body>

    <!-- Intro banner: click anywhere on it to dismiss -->
    <div id="introBanner">
        🔊 Some images are animated — click on them to hear a sound!
        <span>(tap to dismiss)</span>
    </div>
    <!--
        Each panel below is just the page image.
        Gifs + sounds are added automatically by
        script.js — go edit the SOUND_GIFS list at
        the top of that file to add more.
    -->

    <section class="comic-panel" id="part1">
        <img src="images/part1.jpg" class="page" alt="Clementine Citrus comic part 1">
    </section>

    <section class="comic-panel" id="part2">
        <img src="images/part2.jpg" class="page" alt="Clementine Citrus comic part 2">
    </section>

    <section class="comic-panel" id="part3">
        <img src="images/part3.jpg" class="page" alt="Clementine Citrus comic part 3">
    </section>

    <section class="comic-panel" id="part4">
        <img src="images/part4.jpg" class="page" alt="Clementine Citrus comic part 4">
    </section>

    <section class="comic-panel" id="part5">
        <img src="images/part5.jpg" class="page" alt="Clementine Citrus comic part 5">
    </section>

    <section class="comic-panel" id="part6">
        <img src="images/part6.jpg" class="page" alt="Clementine Citrus comic part 6">
    </section>

    <section class="comic-panel" id="part7">
        <img src="images/part7.jpg" class="page" alt="Clementine Citrus comic part 7">
    </section>

    <script src="script.js"></script>

</body>

</html>
